services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: cinema-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "127.0.0.1", "2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cinema-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f kafka.Kafka"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cinema-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cinema
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  postgres:
    image: postgres:16-alpine
    container_name: cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 10

  cinema-service:
    build:
      context: .
      dockerfile: deployment/docker/cinema/Dockerfile
    container_name: cinema-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL_MODE: disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_BOOKING_PAYMENTS_TOPIC: booking.payments
      KAFKA_BOOKING_PAYMENTS_GROUP: cinema-booking-api
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: deployment/docker/order/Dockerfile
    container_name: order-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL_MODE: disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_BOOKING_PAYMENTS_TOPIC: booking.payments
      KAFKA_BOOKING_PAYMENTS_GROUP: cinema-order-service
      APP_METRICS_ADDR: ":8081"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cinema-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./helpers/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cinema-service

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./helpers/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./helpers/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
